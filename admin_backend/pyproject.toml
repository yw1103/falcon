[project]
name = "xhs-admin-backend"
version = "0.1.0"
description = "Management layer for Spider_XHS"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx[socks]>=0.27",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
