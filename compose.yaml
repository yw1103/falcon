services:
  falcon:
    build:
      context: .
      dockerfile: Dockerfile
    image: falcon-admin:local
    restart: unless-stopped
    init: true
    ports:
      - "${FALCON_BIND_HOST:-127.0.0.1}:${FALCON_PORT:-8765}:8765"
    volumes:
      - ./admin_backend/data:/app/admin_backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
